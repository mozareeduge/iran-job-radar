[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iran-job-radar"
version = "0.1.0"
description = "Find jobs in Iran across several job sites, ranked for you with the reasons shown. Persian and English."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools]
packages = ["jobradar"]

[tool.setuptools.package-data]
jobradar = ["data/*.json"]
